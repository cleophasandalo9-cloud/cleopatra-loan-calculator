<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale = 1.0">
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    
    <div class="app-container">

      <!--header-->
      <div class="header">
        <h1>Loan Calculator</h1>
        <p>Plan your repayments with clarity</p>
      </div>

      <!--currency icon button-->
      <div class="currency-toggle" onclick="toggleConverter()">
        &#128178
      </div>

      <!--calculator card-->
      <div class="calculator-card">


        <!--input group-->
        <div class="input-group">
          <label>Loan Amount </label>
          <input type="number" id="amount" placeholder="Enter Amount" step="10">
          <small class="error-message" id="amountError"></small>
        </div>

        <div class="input-group">
          <label>Currency</label>
          
          <input type="text" id="currencySearch" placeholder="Search currency...">
          <select id="currency">
            <option value="USD">USD</option>
            <option value="KES">KES</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="INR">INR</option>
            <option value="JPY">JPY</option>
          </select>
      
          <!--
          <div class="dropdown">

            <div id="selectedCurrency" class="selected">
              USD - US Dollar
            </div>

            <input type="text" id="searchCurrency"      placeholder="Search Currency...">

            <div id="currencyList" class="list"></div>

          </div>
        </div>
        -->
        <div class="input-group">
          <label>Interest Rate (%)</label>
          <input type="number" id="rate" placeholder="Enter Interest Rate p.a" step="10">
          <small class="error-message" id="interestError"></small>
        </div>

        <div class="input-group">
          <label>Loan Duration (Months)</label>
          <input type="number" id="time" placeholder="Enter Duration" step="10">
          <small class="error-message" id="yearsError"></small>
        </div>

        <!--Flex for compund or simple interest-->
        <label for="interestType">Interest Type</label>
        <select id="interestType">
          <option value="compound">Compound Interest</option>
          <option value="simple">Simple Interest</option>
        </select>

        <!--button
        <button onclick="calculateLoan()" class="btn">Calculate</button>
      -->
        <!--results-->
        <div class="results">

          <div class="result-box">
            <h3>Monthly Payment</h3>
            <p id="monthly">0</p>
          </div>

          <div class="result-box">
            <h3>Total Interest</h3>
            <p id="interest">0</p>
          </div>

          <div class="result-box">
            <h3>Total Payment</h3>
            <p id="total">0</p>
          </div>

        </div>

        <!--AMORTIZATION TABLE-->
        <div class="table-container">
        <h3 class="breakdown-title">Payment Breakdown</h3>

        <div class="table-scroll">
        <table id="breakdownTable">
          <thead>
            <tr>
              <th>Month</th>
              <th>Payment</th>
              <th>Interest</th>
              <th>Principal</th>
              <th>Balance</th>
            </tr>
          </thead>
          <tbody>
            <!-- JS will insert rows here -->
          </tbody>
        </table>
        </div>
        
        </div>

        

      </div>
      

    </div>
    <!--currency converter panel-->
    <div class="overlay" id="overlay" onclick="toggleConverter()"></div>
        <div class="converter-panel" id="converterPanel">
          <h3>Currency Converter</h3>

          <div class="input-group">
            <label>Amount</label>
            <input type="number" id="convertAmount" placeholder="Enter amount">
          </div>

          <input type="text" id="fromSearch" placeholder="Search currency...">
          <select id="fromCurrency"></select>

          <div class="input-group">
            <label>From</label>
            <select id="fromCurrency"></select>
          </div>

          <input type="text" id="toSearch" placeholder="Search currency...">
          <select id="toCurrency"></select>
        
          <div class="input-group">
            <label>To</label>
            <select id="toCurrency"></select>
          </div>
        <!--
          <button onclick="convertCurrency()" class="btn">Convert</button>
        -->

          <div class="result-box">
            <h3>Result</h3>
            <p id="convertResult">0</p>
          </div>
        </div>

  </body>
  <script src="script.js"></script>
</html>
